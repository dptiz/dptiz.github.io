<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول</title>
<!-- منع محركات البحث (Google…) من فهرسة الصفحة أو عرضها في النتائج -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f6f7f9}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #slow{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;display:none;background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:10px 16px;
    font:15px Tahoma,Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  #slow button{margin-right:10px;font:inherit;border:1px solid #198754;background:#198754;color:#fff;border-radius:6px;padding:3px 12px;cursor:pointer}
</style>
</head>
<body>
<!-- ⚡ رابط التطبيق (exec) : عند تغيير النشر في Apps Script عدّل هذا السطر فقط -->
<script>var APP_URL='https://script.google.com/macros/s/AKfycbz-6YhJhYDI33PGXeqmhUsbzumn9Oa27KMMQ6aeucvL5XC35OjvKOHm1vtxxcQs76eW_w/exec';</script>

<iframe id="app" title="التطبيق" allow="clipboard-read; clipboard-write; fullscreen; web-share"></iframe>
<div id="slow">التطبيق بطيء في التحميل…<button type="button" id="retry">إعادة المحاولة</button></div>
<script>
  /* التطبيق داخل الإطار : يبقى الرابط الرسمي (dptiz.github.io) ظاهرا دائما في شريط العنوان
     ⚡ لا تحويل تلقائي إلى رابط script.google.com : إذا تأخر التحميل يظهر زر «إعادة المحاولة» داخل نفس الصفحة */
  var fr=document.getElementById('app'),slow=document.getElementById('slow'),OK=false,T=null;
  function load(){OK=false;slow.style.display='none';fr.src=APP_URL;clearTimeout(T);T=setTimeout(function(){if(!OK)slow.style.display='block'},30000)}
  window.addEventListener('message',function(e){if(e.data&&e.data.dp==='ready'){OK=true;slow.style.display='none'}});
  document.getElementById('retry').onclick=load;
  load();
</script>
</body>
</html>
