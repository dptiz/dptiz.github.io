<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول</title>
<!-- منع محركات البحث (Google…) من فهرسة الصفحة أو عرضها في النتائج -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f6f7f9}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #fb{position:fixed;bottom:8px;left:8px;font:12px/1.4 Tahoma,Arial,sans-serif;background:#fff;border:1px solid #dee2e6;border-radius:8px;padding:4px 8px;opacity:.85;z-index:2}
  #fb a{color:#198754;text-decoration:none}
</style>
</head>
<body>
<!-- ⚡ رابط التطبيق : عند تغيير النشر في Apps Script عدّل هذا السطر فقط -->
<script>var APP_URL='https://script.google.com/macros/s/AKfycby6l_IrNUkcAwqJcHTcR6Vew1ixBCx9xfgwxxgZvnWIy74UtLDulJ5ojaiuS_4A5RT3-g/exec';
/* طريقة الفتح : 'frame' = داخل الصفحة (يبقى الرابط القصير ظاهرا) ، 'redirect' = تحويل مباشر إلى التطبيق (أضمن على الهاتف) */
var MODE='redirect';
if(MODE==='redirect')location.replace(APP_URL);</script>

<iframe id="app" title="التطبيق" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="fb"><a id="fbA" href="#" target="_top">فتح التطبيق مباشرة ↗</a></div>
<script>
  if(MODE!=='redirect')document.getElementById('app').src=APP_URL;
  document.getElementById('fbA').href=APP_URL;
</script>
</body>
</html>
