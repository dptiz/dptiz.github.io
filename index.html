<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول</title>
<!-- منع محركات البحث (Google…) من فهرسة الصفحة أو عرضها في النتائج -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f6f7f9}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<!-- ⚡ رابط التطبيق (exec) : عند تغيير النشر في Apps Script عدّل هذا السطر فقط -->
<script>var APP_URL='https://script.google.com/macros/s/AKfycbz-6YhJhYDI33PGXeqmhUsbzumn9Oa27KMMQ6aeucvL5XC35OjvKOHm1vtxxcQs76eW_w/exec';</script>

<iframe id="app" title="التطبيق" allow="clipboard-read; clipboard-write; fullscreen; web-share"></iframe>
<script>
  /* التطبيق داخل الإطار : يبقى الرابط الرسمي ظاهرا في شريط العنوان */
  document.getElementById('app').src=APP_URL;
  /* احتياط : إذا لم يشتغل التطبيق داخل الإطار خلال 15 ثانية → فتحه مباشرة */
  var OK=false;
  window.addEventListener('message',function(e){if(e.data&&e.data.dp==='ready')OK=true});
  setTimeout(function(){if(!OK)location.replace(APP_URL)},15000);
</script>
</body>
</html>
